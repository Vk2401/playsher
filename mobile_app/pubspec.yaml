name: playsher_app
description: Playsher - Sports ground booking mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.4
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  intl: ^0.19.0
  table_calendar: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
