<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Player photo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FC"/><stop offset="1" stop-color="#D3E4F8"/>
    </linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#0061C2" stroke-opacity=".07" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="160" height="160" fill="url(#g)"/>
  <rect width="160" height="160" fill="url(#p)"/>
  <g fill="#0061C2" fill-opacity=".55" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="80" y="80" font-size="13" font-weight="600">Player photo</text>
    <text x="80" y="90" font-size="10" fill-opacity=".8">160 × 160</text>
  </g>
  <rect x="1" y="1" width="158" height="158" fill="none" stroke="#0061C2" stroke-opacity=".18"/>
</svg>
