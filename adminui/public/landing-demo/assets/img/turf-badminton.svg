<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Badminton court">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FC"/><stop offset="1" stop-color="#D3E4F8"/>
    </linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#0061C2" stroke-opacity=".07" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <rect width="800" height="600" fill="url(#p)"/>
  <g fill="#0061C2" fill-opacity=".55" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="400" y="300" font-size="36" font-weight="600">Badminton court</text>
    <text x="400" y="350" font-size="23" fill-opacity=".8">800 × 600</text>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#0061C2" stroke-opacity=".18"/>
</svg>
